databases:
  - name: adearn-db
    plan: free
    region: oregon

services:
  - type: web
    name: adearn
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adearn-db
          property: connectionString
